<!DOCTYPE html>
<html lang="en">

<head>
	<title>Personality Quiz Starter Code</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" href="style.css">

	<!-- import the webpage's javascript file -->
	<script src="/script.js" defer>

	</script>
</head>

<body>

	<header>
		<h1>Build a Froyo & Find Out What Type of Pony You Are!</h1>
		<p>build a frozen yogurt by picking your flavor and toppings. Then you'll see what pony type you are!</p>
	</header>

	<main>

		<h2>Pick A Flavor!</h2>
		<div class="question">

			<div class="answer-choice">
				<img src="assets/vanillafroyo.jpg" alt="a vanilla frozen yogurt in a cup covered in blue and green flower print. There is a clear spoon in the cup.">
        <br>
        <button id="q1a1">vanilla </button>
      </div>

      <div class="answer-choice">
        <img src="assets/chocofroyo.jpg" alt="chocolate frozen yogurt with chocolate drizzle and sprinkles in a clear cup with a white spoon.
">
        <br>
        <button id="q1a2">chocolate</button>
      </div>

    </div> 
    
    <h2>What type of topping do you like best?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/fruit.jpg" alt="multiple clear cups of sliced assorted fruit including strawberries, blueberries, oranges, limes, and bananas.">
        <br>
        <button id="q2a1">fruit</button>
      </div>

      <div class="answer-choice">
        <img src="assets/candy.jpg" alt="Multiple jars of colorful chewy candies all next to eachother">
        <br>
        <button id="q2a2">candy</button>
      </div>

    </div> 
    
    <h2>Lastly, pick a dressing to top it off!</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/sprinkles.jpg" alt="hundreds of multicolor sprinkles">
        <br>
        <button id="q3a1">sprinkles</button>
      </div>

      <div class="answer-choice">
        <img src="assets/whippedcream.jpg" alt="a hand spraying whipped cream onto multicolored pancakes with a pink background">
        <br>
        <button id="q3a2">whipped cream</button>
      </div>

    </div> 
    
    <h2 id="result">Your result is...</h2>
    <button id="restartButton">play again!</button>

    
  </main>
  </body>
</html>
